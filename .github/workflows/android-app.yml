# SPDX-License-Identifier: Apache-2.0
name: Android app and JNI

on:
  pull_request:
    paths:
      - "android/**"
      - "core/include/syit/**"
      - "core/src/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/include/syit/**"
      - "core/src/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare persistent preview signing key
        id: preview_signing
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable preview signing is not configured; APK upload is disabled."
            exit 0
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral signing key for release-variant CI
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/syncinit-ci-release.jks" \
            -storetype JKS \
            -storepass ci-only-changeit \
            -keypass ci-only-changeit \
            -alias syncinit-ci-release \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Sync In It CI Verification"

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Android debug and release variants with backend checks
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_syncinitVersionName: "0.9.0"
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
          ORG_GRADLE_PROJECT_releaseKeystorePath: ${{ runner.temp }}/syncinit-ci-release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ci-only-changeit
          ORG_GRADLE_PROJECT_releaseKeyPassword: ci-only-changeit
          ORG_GRADLE_PROJECT_releaseKeyAlias: syncinit-ci-release
        run: gradle --no-daemon --console=plain --max-workers=2 -p android :app:assembleDebug :app:assembleRelease :backend:check --stacktrace

      - name: Verify release APK signature and package ID
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.syncinit.app'"

      - name: Upload updateable debug APK
        if: success() && steps.preview_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-in-it-android-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
