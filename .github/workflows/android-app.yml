name: Android app and JNI

on:
  pull_request:
    paths:
      - "android/**"
      - "core/include/syit/**"
      - "core/src/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/include/syit/**"
      - "core/src/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "cmake;3.22.1" \
            "ndk;30.0.16248370"

      - name: Build Android debug APK and run transport checks
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sync-in-it-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
