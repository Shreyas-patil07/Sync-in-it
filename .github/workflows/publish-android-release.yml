# SPDX-License-Identifier: Apache-2.0
name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_syncinitVersionName: "0.5.8-preview"
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.5.8.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.5.8.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat <<'EOF'
          ## Sync In It Android Preview v0.5.8

          Measurement-focused preview based on the changes merged in PR #53.

          ### What's included
          - Receiver-specific acoustic markers in the Android PCM output: a 20 ms marker at each one-second sample boundary, with a distinct frequency per receiver ID.
          - tools/clicktrack to generate reference WAV files and tools/analyze to measure the relative arrival skew of two receivers from a 48 kHz PCM16 recording.
          - The analyzer reports signed mean/median skew, p95 and maximum absolute skew, and estimated relative drift slope.
          - Centralized Android preview configuration for transport ports, PCM format, buffering, queues, timeouts, capacity and acoustic marker parameters.
          - Reproducible frontend dependency installation through the committed npm lockfile and npm ci, plus repository/documentation cleanup.

          ### Two-phone measurement
          1. Install this APK on one Host and two Speaker phones. Keep the Speaker apps foregrounded and both screens awake.
          2. Join both Speakers and wait until each reaches READY and the Host schedules the common ANCHOR. A recording without a successful group start is not a valid skew test.
          3. Place both phones at equal distance (approximately 10 cm) from the laptop microphone. Disable Bluetooth, use a fixed volume, and record roughly two minutes in Audacity.
          4. Export an uncompressed 48 kHz PCM16 WAV, then run:

             python -m tools.clicktrack.generate --output-dir recordings/reference --receiver-ids 1 2 --duration-seconds 120

             python -m tools.analyze.analyze --input recordings/two-phone-run.wav --receiver-ids 1 2 --output-dir test-results/two-phone-run

          5. Review skew-report.json and skew-events.csv. The next engineering decision gate is p95 absolute skew at or below 10 ms.

          ### Important limitations
          - CI validates the analyzer against synthetic recordings; no real two-phone acoustic skew result has been measured yet. This release does not claim synchronized-speaker performance.
          - The current Android output remains AudioTrack with a writer thread. Oboe/AAudio, drift correction and manual per-device output offset controls are not implemented.
          - The current Host admits up to 8 Speakers (9 devices including Host); the 6–10 total-phone product target is not capacity validated.
          - There is no foreground playback service or explicit wake-lock lifecycle yet. Keep this to short foreground tests with screens awake; do not run screen-off, background or endurance tests.
          - The session token remains visible in LAN DNS-SD metadata. Use a trusted private network.
          - The audio source is still a generated test signal, not user-selected music or system audio.

          Install over an existing preview using the same persistent preview signing key. Do not uninstall the previous preview first.
          EOF
            printf '\nBuild source commit: [%s](https://github.com/%s/commit/%s)\n' "${GITHUB_SHA:0:12}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > release-notes.md

          if gh release view "v0.5.8-preview.1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v0.5.8-preview.1" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sync In It Android Preview v0.5.8" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "v0.5.8-preview.1" \
              "release-assets/SyncInIt-Android-preview-v0.5.8.apk" \
              "release-assets/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v0.5.8-preview.1" \
              "release-assets/SyncInIt-Android-preview-v0.5.8.apk#SyncInIt-Android-preview-v0.5.8.apk" \
              "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sync In It Android Preview v0.5.8" \
              --notes-file release-notes.md \
              --prerelease
          fi
