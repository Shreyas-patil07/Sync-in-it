name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.4.0.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.4.0.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.4.0

          This preview includes the Android LAN join reliability fixes merged in PR #27.

          ### Included
          - Android launcher with mDNS/DNS-SD nearby host discovery and tap-to-join on the same local Wi-Fi network.
          - Host remains available after a failed or incomplete pre-admission join, and can accept a fresh receiver attempt.
          - UDP time-sync listener binds before the host is advertised, avoiding the startup race that caused ICMP Port Unreachable.
          - Receiver retries transient UDP PortUnreachable responses and reports a clear error after repeated failures.
          - Discovery checks the advertised service-name token fingerprint against the resolved TXT token before attempting TCP admission.
          - Shared C++ protocol codecs and ReceiverSession state machine through JNI.
          - Separate TCP control and audio-admission channels; audio streaming is not implemented yet.
          - UDP four-timestamp clock synchronization and adaptive acquisition.
          - Stable preview signing key, increasing versionCode, and native builds for arm64-v8a and x86_64.

          ### Validation
          - Android Gradle build and Kotlin TCP/UDP transport checks passed in CI.
          - APK signature verification passed.
          - Physical two-phone admission and sustained clock synchronization still need to be re-tested with this release.

          ### Important limitations
          This remains an engineering preview, not a functional synchronized-speaker release. Audio chunks, PCM buffering, audio rendering, playback service, transport encryption and acoustic synchronization validation are not included. The native session still gates readiness while the receiver reports a 0 ms audio buffer.

          Use only on a trusted private Wi-Fi network. The session token is an admission credential, not transport encryption.

          Install as an update over a prior preview signed with the persistent Sync In It preview key.
          EOF

          gh release create "v0.4.0-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.4.0.apk#SyncInIt-Android-preview-v0.4.0.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.4.0" \
            --notes-file release-notes.md \
            --prerelease
