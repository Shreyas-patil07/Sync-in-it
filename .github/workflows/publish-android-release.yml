name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.5.3.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.5.3.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.5.3

          This engineering preview adds multi-Speaker admission and shared sample-indexed PCM fan-out to the Android Host. One Host can now admit up to eight Speaker phones in the same local session.

          ### Included
          - Everything from v0.5.0: LAN discovery, separate TCP control/audio channels, UDP four-timestamp clock acquisition, 48 kHz stereo PCM16 test stream, native bounded sample-indexed jitter buffer via JNI, and Android AudioTrack output.
          - Everything from v0.5.1: on-device LAN diagnostics, active network snapshots, mDNS tracing, join-stage tracing, TCP/UDP endpoint details and nested OS exception classification.
          - Everything from v0.5.2: select the Wi-Fi Network that routes to the discovered Host and bind receiver TCP/UDP sockets to it; no internet validation is required for phone-hotspot networking.
          - One independent native receiver state machine and unique receiver ID per admitted Speaker, while all Speakers share the Host session ID and authentication.
          - Continued Host admission after each Speaker is connected; up to eight connected Speakers in the initial implementation.
          - Independent control readers, READY state, LEAVE/disconnect cleanup and UDP clock-sync endpoint pinning for each Speaker.
          - One shared PCM producer that generates each sample-indexed audio chunk once and fans the same encoded frame out to every Speaker.
          - A bounded per-Speaker audio writer queue. A persistently slow receiver is removed instead of blocking the other Speakers.
          - Host UI reports connected Speaker count. The Host continues to run when an individual Speaker leaves.
          - Persistent preview signing key, monotonic versionCode, and native APK builds for arm64-v8a and x86_64.

          ### Validation
          - Android Gradle/JNI build, Kotlin TCP/UDP transport integration tests and APK signature verification passed in GitHub Actions.
          - Python 3.11, 3.12 and 3.13 plus C++17 core/simulator matrix passed in GitHub Actions.
          - Native C++ tests cover two receiver identities sharing one session ID while maintaining independent readiness and leave state.
          - Physical two-or-more-phone hotspot validation is still required. CI does not prove actual multi-device audio delivery or acoustic synchronization.

          ### Setup and test
          - Enable the Host phone's Android mobile hotspot, then connect all Speaker phones to that hotspot. Internet/mobile data is not required for local session traffic.
          - Start hosting on the Host phone. On each Speaker phone, refresh nearby sessions and join the Host.
          - Confirm the Host count increments (for example, 2/8 connected), both Speakers reach READY, and both receive the shared timing-click stream.
          - Disconnect Speaker 1 and verify Speaker 2 continues receiving PCM and UDP clock replies.
          - The initial limit is eight. Admission is serialized; already-admitted Speakers stream concurrently. Some hotspot implementations may filter mDNS multicast or client-to-client traffic; a QR/manual pairing fallback is not implemented yet.

          ### Important limitations
          The audio source remains a generated 1 kHz timing-click test signal, not user-selected music or system audio. The shared sample index is common, but each receiver currently begins local playback after its own prebuffer and clock acquisition; there is no shared future T0 or guaranteed synchronized start. DAC output timestamp mapping, drift correction, robust gap concealment tuning, foreground playback service, iOS support, acoustic calibration and measured multi-phone synchronization remain pending. This is an engineering preview, not a completed synchronized-speaker release.

          Install as an update over a previous preview signed with the persistent Sync In It preview key.
          EOF

          gh release create "v0.5.3-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.5.3.apk#SyncInIt-Android-preview-v0.5.3.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.5.3" \
            --notes-file release-notes.md \
            --prerelease
