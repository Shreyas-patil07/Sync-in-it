name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.5.2.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.5.2.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.5.2

          This engineering preview adds explicit Android Wi-Fi network selection for phone-hotspot sessions. No external router or internet connection is required when the hotspot allows peer-to-peer traffic.

          ### Included
          - Everything from v0.5.0: nearby discovery, separate TCP control/audio channels, UDP four-timestamp clock acquisition, 48 kHz stereo PCM16 test stream, native bounded sample-indexed jitter buffer via JNI, and Android AudioTrack output.
          - Everything from v0.5.1: detailed on-device LAN diagnostics, network snapshots, mDNS tracing, join-stage tracing, TCP/UDP endpoint diagnostics and nested OS exception classification.
          - Select the connected Wi-Fi Network whose route table matches the discovered host IPv4 address. Network selection does not require INTERNET or VALIDATED capabilities, allowing no-internet mobile-hotspot networks.
          - Bind receiver control TCP, audio TCP and UDP time-sync sockets to the same selected Android Network, avoiding inconsistent default-network routing.
          - Ignore mDNS records that resolve to one of this phone's own interface addresses.
          - Updated connection guidance for a phone hotspot or offline local Wi-Fi network.
          - Persistent preview signing key, monotonically increasing versionCode, and native APK builds for arm64-v8a and x86_64.

          ### Validation
          - Android Gradle/JNI build, Kotlin TCP/UDP transport integration tests and APK signature verification passed in GitHub Actions.
          - Python 3.11, 3.12 and 3.13 plus C++17 core/simulator matrix passed in GitHub Actions.
          - CI validates network selection/socket injection paths at build and transport-test level. Physical hotspot testing across phone manufacturers is still required.

          ### Setup and limitations
          - Enable the Host phone's Android mobile hotspot, then connect each Speaker phone to that hotspot. Internet/mobile data is not required for local session traffic.
          - Start hosting on the Host phone and refresh nearby sessions on the Speaker phone. Some hotspot implementations may filter mDNS multicast or block client-to-client traffic; those cases require a future QR/manual pairing fallback or a different hotspot implementation.
          - The app currently admits one receiver per Host. App-managed LocalOnlyHotspot creation, QR pairing and multi-receiver admission are not included yet.
          - The audio source remains a generated 1 kHz timing-click test signal, not user-selected music or system audio. Playback is not scheduled against a shared future T0; DAC timestamp mapping, drift correction, robust gap concealment, foreground playback service, iOS and acoustic synchronization validation remain pending.
          - This is an engineering preview, not a completed synchronized-speaker release.

          Install as an update over a previous preview signed with the persistent Sync In It preview key.
          EOF

          gh release create "v0.5.2-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.5.2.apk#SyncInIt-Android-preview-v0.5.2.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.5.2" \
            --notes-file release-notes.md \
            --prerelease
