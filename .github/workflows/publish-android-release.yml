name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.5.0.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.5.0.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.5.0

          This engineering preview adds the first end-to-end Android PCM16 audio transport and rendering path on top of the LAN discovery and clock-synchronization foundation.

          ### Included
          - Android host and receiver join flow using local mDNS/DNS-SD discovery.
          - Separate TCP control and audio channels, with UDP four-timestamp clock acquisition.
          - Master-side generated 1 kHz timing-click test signal, encoded as 48 kHz stereo PCM16 in 20 ms chunks.
          - Receiver-side AUDIO_CHUNK validation through the shared C++ codec and bounded sample-indexed jitter buffer via JNI.
          - Android AudioTrack output on a dedicated writer thread, gated by a 3.5-second contiguous prebuffer.
          - Receiver sends READY only after clock acquisition is stable and at least 3 seconds of PCM remain buffered.
          - Native PCM16 JNI smoke test covering frame encoding, duplicate rejection and sample-preserving jitter-buffer reads.
          - Stable preview signing key, monotonically increasing versionCode, and native APK builds for arm64-v8a and x86_64.

          ### Validation
          - Android Gradle/JNI build and Kotlin transport checks passed in GitHub Actions.
          - Native core and simulator checks passed in GitHub Actions.
          - APK signature verification passed.
          - Physical two-phone playback and acoustic timing measurements have not yet been completed.

          ### Important limitations
          The audio source is a generated timing-click test signal, not user-selected music or system audio. Playback currently begins locally after the prebuffer is filled; it is not yet scheduled against a shared future T0. DAC output timestamp mapping, drift correction, gap concealment tuning, multi-receiver admission, foreground playback service, iOS support and measured acoustic synchronization remain pending. This is an engineering preview, not a completed synchronized-speaker release.

          Use on a private Wi-Fi network with client-to-client communication enabled. Install as an update over a previous preview signed with the persistent Sync In It preview key.
          EOF

          gh release create "v0.5.0-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.5.0.apk#SyncInIt-Android-preview-v0.5.0.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.5.0" \
            --notes-file release-notes.md \
            --prerelease
