# SPDX-License-Identifier: Apache-2.0
name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.5.7.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.5.7.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.5.7

          This preview hardens coordinated multi-Speaker admission, pre-playback PCM buffering and READY recovery, building on the M3a DAC output-clock diagnostics introduced in v0.5.6.

          ### Included
          - LAN session discovery and TCP control/audio channels, with UDP four-timestamp clock acquisition.
          - 48 kHz stereo PCM16 test-stream fan-out from one Host to up to eight Speakers, with independent receiver sessions and bounded per-Speaker writer queues.
          - A 15-second admission window for up to eight Speakers, followed by a 45-second readiness deadline. Speakers that do not reach READY are excluded explicitly; ready peers can still start together.
          - READY is retried every second until the common ANCHOR arrives, and repeated READY messages are idempotently handled by the Host.
          - A bounded 20-second rolling PCM pre-roll window before ANCHOR, retaining the newest contiguous audio while clock acquisition completes. After ANCHOR, the buffer switches to strict sample-index handling and never silently skips playback samples.
          - Per-Speaker audio writer queues bounded to 500 ms, with explicit queue-overflow and socket-writer failure diagnostics.
          - Receiver-side anchor handling that maps the Host monotonic target through the clock estimate, seeks to the shared buffered sample index, primes AudioTrack and schedules playback.
          - Native PCM rolling-window and strict post-ANCHOR regression coverage, duplicate-READY state-machine tests and Kotlin/JNI smoke checks.
          - The receiver keeps the long-lived control channel open after WELCOME while waiting for the coordinated playback ANCHOR, with regression coverage for delayed control frames.
          - M3a DAC output timestamp polling through Android AudioTrack on a dedicated helper thread, separate from the PCM writer.
          - Native 30-second rolling regression mapping output frame position to Android monotonic presentation time, with rate-error, fit-residual, sample-span and rejected-sample diagnostics.
          - Timestamp counter wrap handling, reset detection, native regression tests and an Android JNI smoke test.
          - Official Sync In It logo and refreshed Host, Nearby Sessions, Connection Status and Network Diagnostics panels.
          - Persistent preview signing and a monotonically generated Android versionCode for update installs.

          ### Setup and test
          - Enable the Host phone's Android mobile hotspot and connect all Speaker phones to it. Internet access is not required, but hotspot client-to-client traffic and multicast discovery must be allowed.
          - Start hosting on the Host. On each Speaker, keep the app open, refresh nearby sessions and join within 15 seconds of the first successful Speaker admission.
          - Check that each admitted Speaker reaches READY and that the devices begin the generated test stream from the shared scheduled anchor.
          - Keep playback running for at least 30 seconds so the DAC timestamp mapper can collect enough samples for a valid fit. Capture the "DAC timestamp acquisition" and "DAC output clock mapped" diagnostics from each device.
          - Test stop/restart and reconnect behavior on two or more physical phones. Physical device and hotspot validation is not performed by CI.

          ### Important limitations
          - The audio source is still a generated 1 kHz timing-click test signal, not user-selected music or system audio.
          - DAC mapping is diagnostics only in this preview. Its estimate is not yet published to the playback callback, used to change playback scheduling, or used for drift correction or manual per-device output offsets.
          - Android output timestamps are best-effort and may be unavailable on some device/audio routes. The mapping does not measure acoustic sound arrival at the speaker and does not include hardware delays unknown to Android.
          - A valid regression fit requires at least four timestamp samples spanning 20 seconds. Fit residuals describe the timestamp model, not acoustic synchronization accuracy.
          - Bluetooth routing, device-specific AudioTrack/HAL latency, microphone-based calibration and real multi-phone acoustic timing remain uncalibrated.
          - The Host cohort is fixed after the 15-second admission window. A late Speaker requires a new Host group. Speakers that do not reach READY within 45 seconds of the first admission are removed; ready peers may proceed together.
          - This is an engineering preview, not a claim of verified synchronized-speaker performance.

          Install as an update over an existing Sync In It preview signed with the same persistent preview key. Do not uninstall the previous preview first.
          EOF

          if gh release view "v0.5.7-preview.1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v0.5.7-preview.1" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sync In It Android Preview v0.5.7" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "v0.5.7-preview.1" \
              "release-assets/SyncInIt-Android-preview-v0.5.7.apk" \
              "release-assets/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v0.5.7-preview.1" \
              "release-assets/SyncInIt-Android-preview-v0.5.7.apk#SyncInIt-Android-preview-v0.5.7.apk" \
              "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sync In It Android Preview v0.5.7" \
              --notes-file release-notes.md \
              --prerelease
          fi
