name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Build APK and run transport tests
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Prepare release asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.1.0.apk

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.1.0

          This preview contains the initial Android launcher, native C++ receiver-session bridge (JNI), and the Kotlin TCP/UDP transport module.

          ### Build
          - Android SDK 36
          - arm64-v8a and x86_64 native builds
          - Debug APK

          ### Scope
          This is an early engineering preview, not a production audio-streaming release. Socket-to-session orchestration, audio capture/playback, secure transport, and physical two-phone validation are not included yet.

          Install only on test devices. Android may ask you to allow installation from your browser or file manager.
          EOF

          gh release create "v0.1.0-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.1.0.apk#SyncInIt-Android-preview-v0.1.0.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.1.0" \
            --notes-file release-notes.md \
            --prerelease
