name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Configure persistent preview signing key
        id: preview_signing
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 || vars.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD || vars.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD are not configured; skipping preview release publish."
            exit 0
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD || vars.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD || vars.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        if: steps.preview_signing.outputs.enabled == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        if: steps.preview_signing.outputs.enabled == 'true'
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.3.0.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.3.0.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        if: steps.preview_signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.3.0

          This preview adds nearby-host discovery and a stable Android signing identity so future APK installs can update the existing app in place.

          ### Included
          - Android launcher with mDNS/DNS-SD nearby host discovery and tap-to-join on the same local Wi-Fi network.
          - Stable preview signing key and increasing versionCode for in-place updates; keep the app's package ID unchanged.
          - Shared C++ protocol codecs and ReceiverSession state machine through JNI.
          - Separate TCP control and audio-admission channels (audio streaming is not implemented yet).
          - UDP four-timestamp time synchronization using the shared native TimeSyncResponder, TimeSyncClient and clock estimator.
          - Adaptive acquisition: 20 probes at 50 ms spacing, 500 ms retries while unstable, then 2-second tracking after the provisional clock-stability gate passes.
          - Native TCP/UDP loopback smoke checks on app startup.
          - Native builds for arm64-v8a and x86_64.

          ### Important limitations
          This is an engineering preview, not a functional synchronized speaker release. No audio chunks, PCM buffering, audio rendering, playback service, encryption or acoustic synchronization validation are included. The receiver sends READY only after clock acquisition; the master rejects it while the reported audio buffer is 0 ms.

          Use only on a trusted private Wi-Fi network. The session token is an admission credential, not transport encryption. Physical two-phone discovery and clock validation are still required.

          Existing APKs signed with an ephemeral CI debug key may require one final uninstall/reinstall to migrate to the persistent signing key. Later previews signed with this same key install as updates.
          EOF

          gh release create "v0.3.0-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.3.0.apk#SyncInIt-Android-preview-v0.3.0.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.3.0" \
            --notes-file release-notes.md \
            --prerelease
