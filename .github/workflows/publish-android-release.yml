# SPDX-License-Identifier: Apache-2.0
name: Publish Android Preview Release

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semantic version tag to publish (for example v0.6.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Derive release tag and app version
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          RELEASE_TAG="$INPUT_RELEASE_TAG"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${REF_NAME#release/}"
          fi
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Expected a semantic version tag such as v0.6.1; received '$RELEASE_TAG'."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG from $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Require persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SYNCINIT_PREVIEW_KEYSTORE_BASE64 and SYNCINIT_PREVIEW_KEYSTORE_PASSWORD before publishing an updateable APK."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > android/app/syncinit-preview.jks
          test -s android/app/syncinit-preview.jks
          keytool -list -keystore android/app/syncinit-preview.jks \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias syncinit-preview >/dev/null

      - name: Generate monotonic Android version code
        id: apk_version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build updateable APK and run transport tests
        env:
          ORG_GRADLE_PROJECT_syncinitVersionCode: ${{ steps.apk_version.outputs.code }}
          ORG_GRADLE_PROJECT_syncinitVersionName: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_previewKeystorePath: ${{ github.workspace }}/android/app/syncinit-preview.jks
          ORG_GRADLE_PROJECT_previewStorePassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyPassword: ${{ secrets.SYNCINIT_PREVIEW_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_previewKeyAlias: syncinit-preview
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          APK="SyncInIt-Android-preview-v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/$APK"
          sha256sum "release-assets/$APK" | awk '{print $1}' > release-assets/SHA256SUMS.txt
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
        id: assets

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          NOTES_FILE="RELEASE_NOTES_${RELEASE_TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            cat > release-notes.md <<EOF
          # Sync In It Android Preview v${VERSION}

          This is an engineering preview. Read the release-specific notes and validation status before installing.

          ### Validation and limitations
          - The release workflow builds an updateable APK with the persistent preview signing key and runs Android transport checks.
          - Physical multi-device playback and long-duration network reliability require separate device validation.
          - Do not treat a successful build or software scheduling logs as proof of acoustic synchronization.
          - Diagnostic reports can contain device model, local network addresses, session IDs and timing metadata. Review before sharing.
          EOF
          fi

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite a published release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "release-assets/$APK#$APK" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v$VERSION" \
            --notes-file release-notes.md \
            --prerelease
