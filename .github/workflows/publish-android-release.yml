name: Publish Android Preview Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Build APK and run transport tests
        run: gradle -p android :app:assembleDebug :transport:check --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/SyncInIt-Android-preview-v0.2.0.apk
          sha256sum release-assets/SyncInIt-Android-preview-v0.2.0.apk \
            | awk '{print $1}' > release-assets/SHA256SUMS.txt

      - name: Create GitHub pre-release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Sync In It Android Preview v0.2.0

          This preview adds the Android one-master/one-receiver TCP admission flow and UDP clock-acquisition path.

          ### Included
          - Android launcher with Host and Join modes for devices on the same local Wi-Fi network.
          - Shared C++ protocol codecs and ReceiverSession state machine through JNI.
          - Separate TCP control and audio-admission channels (audio streaming is not implemented yet).
          - UDP four-timestamp time synchronization using the shared native TimeSyncResponder, TimeSyncClient and clock estimator.
          - Adaptive acquisition: 20 probes at 50 ms spacing, 500 ms retries while unstable, then 2-second tracking after the provisional clock-stability gate passes.
          - Native TCP/UDP loopback smoke checks on app startup.
          - Native builds for arm64-v8a and x86_64.

          ### Important limitations
          This is an engineering preview, not a functional synchronized speaker release. No audio chunks, PCM buffering, audio rendering, playback service, encryption or acoustic synchronization validation are included. The receiver sends READY only after clock acquisition; the master rejects it while the reported audio buffer is 0 ms.

          Use only on a trusted private Wi-Fi network. The session token is an admission credential, not transport encryption. Physical two-phone clock validation is still required.
          EOF

          gh release create "v0.2.0-preview.1" \
            "release-assets/SyncInIt-Android-preview-v0.2.0.apk#SyncInIt-Android-preview-v0.2.0.apk" \
            "release-assets/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sync In It Android Preview v0.2.0" \
            --notes-file release-notes.md \
            --prerelease
