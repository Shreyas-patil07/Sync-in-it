# SPDX-License-Identifier: Apache-2.0
name: Kotlin socket transport

on:
  workflow_dispatch:

concurrency:
  group: kotlin-transport-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and run transport integration tests
        run: |
          if [ ! -f android/transport/build.gradle.kts ]; then
            echo "::notice::The local socket transport module was removed from this cloud-only branch; legacy transport checks are skipped."
            exit 0
          fi
          gradle -p android/transport check
