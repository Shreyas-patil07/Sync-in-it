# SPDX-License-Identifier: Apache-2.0
name: Kotlin socket transport

on:
  pull_request:
    paths:
      - "android/transport/**"
      - ".github/workflows/kotlin-transport.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "android/transport/**"
      - ".github/workflows/kotlin-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and run transport integration tests
        run: |
          if [ ! -f android/transport/build.gradle.kts ]; then
            echo "::notice::The local socket transport module was removed from this cloud-only branch; legacy transport checks are skipped."
            exit 0
          fi
          gradle -p android/transport check
