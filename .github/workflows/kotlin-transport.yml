name: Kotlin socket transport

on:
  pull_request:
    paths:
      - "android/transport/**"
      - ".github/workflows/kotlin-transport.yml"
  push:
    branches: [main]
    paths:
      - "android/transport/**"
      - ".github/workflows/kotlin-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and run transport integration tests
        run: gradle -p android/transport check
