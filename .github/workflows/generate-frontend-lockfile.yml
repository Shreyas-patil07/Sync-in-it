# SPDX-License-Identifier: Apache-2.0
name: Generate frontend lockfile

on:
  push:
    branches:
      - "measurement/**"
    paths:
      - "frontend/package.json"
      - ".github/workflows/generate-frontend-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the measurement branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Resolve and create the npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the generated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Add reproducible frontend dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
