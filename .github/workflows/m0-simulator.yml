# SPDX-License-Identifier: Apache-2.0
name: M0 simulator and native core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulator-and-core:
    name: Python ${{ matrix.python-version }} + C++17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run click-track and acoustic-skew tooling tests
        run: python -m unittest discover -s tools/tests -v
      - name: Run Python unit and golden-vector tests
        env:
          PYTHONPATH: sim/src
        run: python -m unittest discover -s sim/tests -v
      - name: Configure C++17 timing core
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
      - name: Build C++17 timing core
        run: cmake --build build/core --config Release --parallel 2
      - name: Run C++ golden-vector parity tests
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: Run deterministic simulator scenarios
        env:
          PYTHONPATH: sim/src
        run: python -m sync_in_it_sim --duration 60 --seed 7
      - name: Enforce M0 scenario acceptance gates
        env:
          PYTHONPATH: sim/src
        run: python -m sync_in_it_sim --duration 60 --seed 7 --check-acceptance
      - name: Run shared Wi-Fi airtime and queue scenarios
        env:
          PYTHONPATH: sim/src
        run: python -m sync_in_it_sim --lan --duration 30 --seed 7
