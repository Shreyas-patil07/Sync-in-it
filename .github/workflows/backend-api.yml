# SPDX-License-Identifier: Apache-2.0
name: Backend API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/publish-android-release.yml"
      - ".github/workflows/backend-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/publish-android-release.yml"
      - ".github/workflows/backend-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Run backend API tests
        working-directory: backend
        run: python -m pytest
