# SPDX-License-Identifier: Apache-2.0
name: Browser signaling

on:
  pull_request:
    paths:
      - "browser-signaling/**"
      - ".github/workflows/browser-signaling.yml"
  push:
    branches: [main, "fix/**", "feature/**"]
    paths:
      - "browser-signaling/**"
      - ".github/workflows/browser-signaling.yml"

permissions:
  contents: read

jobs:
  signaling-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-signaling
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run signaling integration tests
        run: npm test
